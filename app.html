<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Runaway Budget Game</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: rgb(132, 93, 118); /* Your resume berry-mauve theme */
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .game-container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            padding: 30px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            border-top: 8px solid rgb(214, 122, 177); /* Your vibrant pink accent */
        }
        h1 {
            color: rgb(132, 93, 118);
            margin-top: 0;
        }
        p {
            font-size: 1.1em;
            line-height: 1.5;
            color: #555;
        }
        .input-group {
            margin: 25px 0;
        }
        input[type="number"] {
            padding: 12px;
            width: 120px;
            font-size: 1.2em;
            border: 2px solid #ccc;
            border-radius: 6px;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="number"]:focus {
            border-color: rgb(132, 93, 118);
        }
        button {
            padding: 12px 24px;
            font-size: 1em;
            background-color: rgb(132, 93, 118);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: rgb(105, 72, 93);
        }
        .message {
            margin-top: 20px;
            font-size: 1.2em;
            font-weight: bold;
            min-height: 1.5em;
        }
        .attempts {
            color: #888;
            font-size: 0.9em;
            margin-top: 10px;
        }
        .nav-link {
            display: inline-block;
            margin-top: 25px;
            color: rgb(132, 93, 118);
            text-decoration: none;
            font-weight: bold;
        }
        .nav-link:hover {
            color: rgb(214, 122, 177);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>📉 Runaway Budget!</h1>
        <p>Your monthly spending layout is out of balance! There is a hidden, automated subscription leak costing between <strong>$1 and $100</strong>.</p>
        <p>Can you guess the exact dollar amount of the leak to cancel it and save your budget?</p>

        <div class="input-group">
            <input type="number" id="guessInput" min="1" max="100" placeholder="$ Amount">
            <button onclick="checkBudgetGuess()">Audit Account</button>
        </div>

        <div class="message" id="feedbackMessage"></div>
        <div class="attempts" id="attemptCount">Audits performed: 0</div>

        <a href="Resume.html" class="nav-link">← Return to Portfolio</a>
    </div>

    <script>
        const secretLeak = Math.floor(Math.random() * 100) + 1;
        let totalAudits = 0;

        function checkBudgetGuess() {
            const inputField = document.getElementById('guessInput');
            const feedback = document.getElementById('feedbackMessage');
            const attemptDisplay = document.getElementById('attemptCount');
            const userGuess = parseInt(inputField.value);

            if (isNaN(userGuess) || userGuess < 1 || userGuess > 100) {
                feedback.style.color = '#d32f2f';
                feedback.innerText = "Please input a valid statement between $1 and $100.";
                return;
            }

            totalAudits++;
            attemptDisplay.innerText = `Audits performed: ${totalAudits}`;

            if (userGuess === secretLeak) {
                feedback.style.color = 'rgb(132, 93, 118)';
                feedback.innerHTML = `🎉 Success! You caught the $${secretLeak} leak and balanced the budget in ${totalAudits} audits!`;
                inputField.disabled = true;
            } else if (userGuess < secretLeak) {
                feedback.style.color = 'rgb(214, 122, 177)';
                feedback.innerText = "Too low! The leak is larger than that. Try a higher asset amount.";
            } else {
                feedback.style.color = 'rgb(214, 122, 177)';
                feedback.innerText = "Too high! Your budget isn't bleeding that much. Try a lower dollar amount.";
            }

            inputField.value = '';
            inputField.focus();
        }
    </script>

</body>
</html>
